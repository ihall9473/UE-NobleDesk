name: Apply Supabase schema

# Runs schema.sql against the production database whenever it changes on
# main, so a migration never has to be hand-pasted into the Supabase SQL
# Editor again. Also runnable manually (workflow_dispatch) to confirm the
# SUPABASE_DB_URL secret is wired up correctly.
on:
  push:
    branches: [main]
    paths: [schema.sql]
  workflow_dispatch: {}

jobs:
  apply-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply schema.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set"
            exit 1
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f schema.sql
